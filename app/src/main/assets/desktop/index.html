<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symbian Desktop</title>
<style>
:root {
  --bg: #0066CC; --surface: #005080; --text: #FFFFFF; --accent: #00CCCC; --hl: #FDD835;
  --hl-top: color-mix(in srgb, var(--hl) 60%, white);
  --bg-top: color-mix(in srgb, var(--bg) 80%, white);
  --bg-bottom: color-mix(in srgb, var(--bg) 65%, black);
  --panel: color-mix(in srgb, var(--surface) 70%, transparent);
  --line: color-mix(in srgb, var(--text) 28%, transparent);
  --muted: color-mix(in srgb, var(--text) 68%, transparent);
  --bad: #ff5a4f; --bad-text: #ffb3ad; --good: #6fe36f;
  --font: "Nokia Sans S60", "Nokia Sans", "Nokia Pure Text", Tahoma, "Segoe UI", Verdana, sans-serif;
  --shadow: 1px 1px 2px rgba(0,0,0,.65);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 15px/1.35 var(--font); color: var(--text);
  background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 35%, var(--bg-bottom) 100%) fixed;
  overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.hidden { display: none !important; }

/* ── App frame ─────────────────────────────── */
#app { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
.status {
  display: flex; align-items: center; gap: 18px; padding: 6px 14px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 75%, white) 0%, var(--surface) 55%, color-mix(in srgb, var(--surface) 80%, black) 100%);
  border-bottom: 1px solid rgba(0,0,0,.35); text-shadow: var(--shadow);
}
.signal { display: flex; align-items: flex-end; gap: 2px; height: 18px; }
.signal i { width: 4px; background: var(--text); opacity: .25; border-radius: 1px; }
.signal i.on { opacity: 1; }
.signal i:nth-child(1){height:5px}.signal i:nth-child(2){height:9px}.signal i:nth-child(3){height:13px}.signal i:nth-child(4){height:18px}
.status .op { font-weight: bold; }
.status .grow { flex: 1; }
.status .clock { font-weight: bold; font-size: 20px; letter-spacing: .5px; }
.battery { display: flex; align-items: center; gap: 6px; }
.battery .cell { width: 30px; height: 14px; border: 2px solid var(--text); border-radius: 2px; position: relative; padding: 1px; }
.battery .cell::after { content: ""; position: absolute; right: -5px; top: 3px; width: 3px; height: 4px; background: var(--text); }
.battery .fill { height: 100%; background: var(--good); }
.battery.low .fill { background: var(--bad); }
.link-state { font-size: 13px; color: var(--muted); }
.link-state.off { color: var(--hl); }
.wx-mini { display: flex; align-items: center; gap: 4px; }

.body { display: grid; grid-template-columns: 210px 1fr; min-height: 0; }
nav { background: var(--panel); border-right: 1px solid rgba(0,0,0,.3); overflow-y: auto; padding: 6px 0; }
nav button {
  display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 14px; border: 0; background: none;
  text-align: left; cursor: pointer; font-weight: bold; text-shadow: var(--shadow); font-size: 16px;
}
nav button svg { width: 22px; height: 22px; flex: none; fill: var(--accent); filter: drop-shadow(1px 1px 1px rgba(0,0,0,.5)); }
nav button .badge { margin-left: auto; }
.sel, nav button.active, nav button:focus-visible, .row:focus-visible, .row.active {
  background: linear-gradient(180deg, var(--hl-top) 0%, var(--hl-top) 50%, var(--hl) 50.1%, var(--hl) 100%);
  color: #000; text-shadow: none; outline: none; border-radius: 4px;
}
nav button.active svg, .row.active svg { fill: #000; filter: none; }
.badge { background: var(--bad); color: #fff; border-radius: 10px; padding: 0 7px; font-size: 12px; min-width: 20px; text-align: center; text-shadow: none; }

main { display: grid; min-height: 0; overflow: hidden; }
.view { display: grid; min-height: 0; overflow: hidden; }
.split { grid-template-columns: minmax(260px, 360px) 1fr; }
.pane { min-height: 0; overflow-y: auto; }
.pane + .pane { border-left: 1px solid rgba(0,0,0,.25); }
.title {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-weight: bold; font-size: 18px;
  text-shadow: var(--shadow); position: sticky; top: 0; z-index: 2;
  background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 85%, white), var(--bg));
  border-bottom: 1px dashed var(--line);
}
.title .grow { flex: 1; }
.search { width: 100%; padding: 7px 10px; border-radius: 4px; border: 1px solid rgba(0,0,0,.4); background: rgba(255,255,255,.92); color: #000; }
.toolbar { padding: 8px 14px; display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px dashed var(--line); }

.row {
  display: flex; gap: 10px; align-items: center; padding: 9px 14px; cursor: pointer;
  border-bottom: 1px dashed var(--line); text-shadow: var(--shadow); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left;
}
.row .main { flex: 1; min-width: 0; }
.row .name, .row .sub { display: block; }
.row .name { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.active .sub { color: #222; }
.row .meta { font-size: 12px; color: var(--muted); text-align: right; flex: none; }
.row.active .meta { color: #222; }
.avatar {
  width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: bold;
  color: #fff; text-shadow: var(--shadow); border: 2px solid rgba(255,255,255,.7); overflow: hidden; background-size: cover;
}
.appicon { width: 34px; height: 34px; border-radius: 6px; flex: none; }
.empty { padding: 30px 20px; text-align: center; color: var(--muted); }

.btn { text-decoration: none; display: inline-block;
  border: 1px solid rgba(0,0,0,.45); border-radius: 5px; padding: 6px 14px; cursor: pointer; font-weight: bold;
  background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 55%, white) 0%, var(--surface) 55%, color-mix(in srgb, var(--surface) 75%, black));
  text-shadow: var(--shadow); white-space: nowrap;
}
.btn:hover, .btn:focus-visible { background: linear-gradient(180deg, var(--hl-top) 0%, var(--hl-top) 50%, var(--hl) 50.1%); color: #000; text-shadow: none; outline: none; }
.btn.good { background: linear-gradient(180deg, #7be37b, #2f9e2f); }
.btn.bad { background: linear-gradient(180deg, #ff8077, #c3261d); }
.btn.small { padding: 3px 9px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

/* ── Conversation ─────────────────────────── */
.convo { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; height: 100%; }
.bubbles { overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; }
.bubble { max-width: 70%; padding: 7px 11px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; box-shadow: 1px 1px 3px rgba(0,0,0,.35); }
.bubble.in { align-self: flex-start; background: rgba(255,255,255,.93); color: #111; border-bottom-left-radius: 2px; }
.bubble.out { align-self: flex-end; background: linear-gradient(180deg, var(--hl-top), var(--hl)); color: #000; border-bottom-right-radius: 2px; }
.bubble .t { display: block; font-size: 11px; opacity: .6; margin-top: 2px; text-align: right; }
.bubble.failed { outline: 2px solid var(--bad); }
.daysep { align-self: center; font-size: 12px; color: var(--muted); padding: 6px 0; }
.compose { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px dashed var(--line); align-items: flex-end; background: var(--panel); }
.compose textarea {
  flex: 1; resize: none; min-height: 40px; max-height: 160px; padding: 8px 10px; border-radius: 6px;
  border: 1px solid rgba(0,0,0,.4); background: #fff; color: #000;
}
.counter { font-size: 12px; color: var(--muted); min-width: 64px; text-align: right; }
.recipient { display: flex; gap: 8px; padding: 10px 14px; border-bottom: 1px dashed var(--line); position: relative; }
.suggest { position: absolute; left: 14px; right: 14px; top: 100%; z-index: 5; background: var(--surface); border: 1px solid rgba(0,0,0,.5); max-height: 260px; overflow-y: auto; }

/* ── Home dashboard ───────────────────────── */
.home { overflow-y: auto; padding: 18px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); align-content: start; }
.card { background: var(--panel); border: 1px solid rgba(0,0,0,.3); border-radius: 8px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.card h3 { margin: 0; padding: 8px 12px; font-size: 15px; text-shadow: var(--shadow); border-bottom: 1px dashed var(--line);
  background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 70%, white), var(--surface)); }
.card .in { padding: 12px; }
.bigclock { font-size: 64px; font-weight: bold; text-shadow: 2px 2px 3px rgba(0,0,0,.6); line-height: 1; }
.bigdate { font-size: 18px; color: var(--muted); margin-top: 6px; }
.wxnow { display: flex; align-items: center; gap: 14px; }
.wxnow .ic { font-size: 54px; }
.wxnow .temp { font-size: 44px; font-weight: bold; text-shadow: var(--shadow); }
.wxstrip { display: flex; gap: 4px; overflow-x: auto; padding-top: 10px; }
.wxstrip div { flex: none; width: 54px; text-align: center; font-size: 12px; }
.wxstrip b { display: block; font-size: 20px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.kv span:nth-child(odd) { color: var(--muted); }
.meter { height: 8px; background: rgba(0,0,0,.3); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ── Dialer ───────────────────────────────── */
.dialer { padding: 16px; display: grid; gap: 10px; justify-items: center; }
.dialer input { width: 100%; max-width: 300px; font-size: 26px; text-align: center; padding: 6px; border-radius: 6px; border: 1px solid rgba(0,0,0,.4); background: #fff; color: #000; }
.keys { display: grid; grid-template-columns: repeat(3, 72px); gap: 8px; }
.keys .btn { height: 52px; font-size: 22px; }
.keys .btn small { display: block; font-size: 10px; font-weight: normal; opacity: .75; }

/* ── Softkeys ─────────────────────────────── */
.softkeys {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 6px 14px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 75%, white) 0%, var(--surface) 55%, color-mix(in srgb, var(--surface) 80%, black));
  border-top: 1px solid rgba(0,0,0,.35);
}
.softkeys button { border: 0; background: none; font-weight: bold; font-size: 17px; cursor: pointer; text-shadow: var(--shadow); padding: 4px 8px; }
.softkeys button:hover { color: var(--hl); }
.softkeys .r { justify-self: end; }
.softkeys button:first-child { justify-self: start; }
.softkeys .c { font-size: 12px; color: var(--muted); text-shadow: none; }

/* ── Overlays ─────────────────────────────── */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 50; }
.dialog {
  width: min(420px, 92vw); border-radius: 8px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.6);
  background: linear-gradient(180deg, var(--bg-top), var(--bg) 40%, var(--bg-bottom)); border: 2px solid rgba(255,255,255,.5);
}
.dialog h2 { margin: 0; padding: 10px 14px; font-size: 18px; text-shadow: var(--shadow);
  background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 70%, white), var(--surface)); border-bottom: 1px dashed var(--line); }
.dialog .in { padding: 16px; display: grid; gap: 12px; }
.dialog .row2 { display: flex; gap: 8px; justify-content: flex-end; }
.code { font-size: 34px; letter-spacing: 10px; text-align: center; padding: 8px; border-radius: 6px; border: 1px solid rgba(0,0,0,.4); background: #fff; color: #000; width: 100%; }
.err { color: var(--hl); font-weight: bold; min-height: 1.3em; }
.callbar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: linear-gradient(180deg, #2e9e3a, #1b6d24); text-shadow: var(--shadow); }
.callbar.ringing { animation: pulse 1s infinite alternate; }
@keyframes pulse { to { background: linear-gradient(180deg, #4fd35d, #23812e); } }
.toast { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.85); padding: 8px 16px; border-radius: 6px; z-index: 60; }
.drop { border: 2px dashed var(--line); border-radius: 8px; padding: 26px; text-align: center; color: var(--muted); }
.drop.over { border-color: var(--hl); color: var(--hl); }
textarea.note { width: 100%; min-height: 80px; padding: 8px; border-radius: 6px; border: 1px solid rgba(0,0,0,.4); background: #fff; color: #000; resize: vertical; }

/* ── Photos & MMS ─────────────────────────── */
.mms { display: block; max-width: 260px; max-height: 260px; border-radius: 6px; margin: 4px 0; cursor: zoom-in; }
.photogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px; padding: 4px 14px 14px; }
.ph { position: relative; aspect-ratio: 1; background: rgba(0,0,0,.25) center/cover no-repeat; border-radius: 4px; cursor: pointer; overflow: hidden; border: 2px solid transparent; }
.ph:hover { border-color: var(--hl-top); }
.ph.sel { border-color: var(--hl); box-shadow: inset 0 0 0 3px var(--hl); }
.ph .tick { position: absolute; top: 6px; left: 6px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.35); display: none; place-items: center; color: #000; font-weight: bold; font-size: 14px; }
.photogrid.selecting .ph .tick, .ph:hover .tick { display: grid; }
.ph.sel .tick { background: var(--hl); }
.ph .dur { position: absolute; right: 6px; bottom: 6px; font-size: 12px; background: rgba(0,0,0,.65); padding: 0 5px; border-radius: 3px; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 70; display: grid; grid-template-rows: auto 1fr; }
.lightbox .bar { display: flex; gap: 8px; align-items: center; padding: 8px 14px; }
.lightbox .stage { display: grid; place-items: center; min-height: 0; position: relative; }
.lightbox img, .lightbox video { max-width: 96vw; max-height: calc(100vh - 70px); object-fit: contain; }
.lightbox .nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 34px; padding: 10px 16px; }
.checks { display: grid; gap: 6px; margin: 8px 0; }
.checks label { display: flex; gap: 8px; align-items: center; cursor: pointer; }

/* ── Wallet ───────────────────────────────── */
.wallet { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; padding: 16px; align-content: start; }
.pass { border-radius: 12px; padding: 14px 16px; color: var(--fg); background: var(--pbg); box-shadow: 0 4px 12px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25);
  cursor: pointer; position: relative; overflow: hidden; min-height: 190px; display: flex; flex-direction: column; gap: 8px; border: 0; text-align: left; font: inherit; }
.pass::after { content: ""; position: absolute; inset: 0 0 55% 0; background: linear-gradient(180deg, rgba(255,255,255,.18), transparent); pointer-events: none; }
.pass:hover, .pass:focus-visible { outline: 3px solid var(--hl); }
.pass .top { display: flex; align-items: center; gap: 10px; }
.pass .top img { max-height: 32px; max-width: 110px; }
.pass .org { font-weight: bold; font-size: 16px; flex: 1; }
.pass .kind { font-size: 11px; opacity: .8; border: 1px solid currentColor; border-radius: 8px; padding: 0 6px; }
.pass .fields { display: flex; gap: 16px; flex-wrap: wrap; }
.pass .f small { display: block; font-size: 10px; letter-spacing: .5px; color: var(--lbl); text-transform: uppercase; }
.pass .f b { font-size: 15px; }
.pass .f.big b { font-size: 26px; }
.pass .route { display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: bold; }
.pass .route span { font-size: 18px; opacity: .7; }
.pass .code { width: fit-content; margin-left: auto; margin-right: auto; margin-top: auto; background: #fff; border-radius: 6px; padding: 6px; align-self: center; }
.pass .code img { display: block; max-height: 90px; max-width: 220px; }
.passdetail .code img { max-height: 280px; max-width: 100%; }
.addcard { border: 2px dashed var(--line); border-radius: 12px; min-height: 190px; display: grid; place-items: center; text-align: center; padding: 16px; color: var(--muted); }
.addcard.over { border-color: var(--hl); color: var(--hl); }

.logopick { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; max-height: 50vh; overflow-y: auto; }
.logopick button { background: #fff; border: 2px solid transparent; border-radius: 6px; padding: 6px; cursor: pointer; display: grid; gap: 4px; justify-items: center; color: #333; font-size: 10px; }
.logopick button:hover, .logopick button:focus-visible { border-color: var(--hl); outline: none; }
.logopick img { max-width: 96px; max-height: 64px; object-fit: contain; }
.logoprev { background: #fff; border-radius: 6px; padding: 6px; min-width: 80px; min-height: 40px; display: grid; place-items: center; color: #555; font-size: 12px; }
.logoprev img { max-height: 48px; max-width: 160px; }
.fieldrows { display: grid; gap: 6px; }
.fieldrows .fr { display: grid; grid-template-columns: 1fr 2fr auto; gap: 6px; }
.fieldrows input { padding: 5px 7px; border-radius: 5px; border: 1px solid rgba(0,0,0,.4); background: #fff; color: #000; font: inherit; }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: bold; }
.switch input { display: none; }
.switch i { width: 46px; height: 26px; border-radius: 13px; background: rgba(0,0,0,.4); position: relative; transition: background .15s; border: 1px solid rgba(0,0,0,.5); }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #eee; transition: left .15s; }
.switch input:checked + i { background: var(--good); }
.switch input:checked + i::after { left: 22px; }
.clipnow { background: rgba(255,255,255,.93); color: #111; border-radius: 8px; padding: 12px; white-space: pre-wrap; word-break: break-word; max-height: 200px; overflow-y: auto; font-size: 15px; }
code.cmd { display: block; background: rgba(0,0,0,.45); padding: 6px 8px; border-radius: 4px; font-size: 12px; margin: 4px 0; user-select: all; word-break: break-all; }

/* ── Calendar ─────────────────────────────── */
.calbar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px dashed var(--line); flex-wrap: wrap; }
.calbar .label { font-weight: bold; font-size: 18px; text-shadow: var(--shadow); min-width: 220px; }
.seg { display: inline-flex; border: 1px solid rgba(0,0,0,.45); border-radius: 5px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button.on { background: linear-gradient(180deg, var(--hl-top) 0%, var(--hl-top) 50%, var(--hl) 50.1%); color: #000; text-shadow: none; }
.calview { display: grid; grid-template-rows: auto 1fr; min-height: 0; height: 100%; }
.month { display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: auto repeat(6, 1fr); height: 100%; min-height: 0; }
.month .dow { padding: 4px 8px; font-size: 12px; color: var(--muted); border-bottom: 1px dashed var(--line); text-align: center; }
.month .cell { border-right: 1px dashed var(--line); border-bottom: 1px dashed var(--line); padding: 3px 4px; overflow: hidden; cursor: pointer; min-height: 0; }
.month .cell.other { opacity: .5; }
.month .cell:hover { background: rgba(255,255,255,.06); }
.month .num { font-size: 13px; font-weight: bold; display: inline-block; min-width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 12px; text-shadow: var(--shadow); }
.month .cell.today .num { background: var(--hl); color: #000; text-shadow: none; }
.chip { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 1px 5px; border-radius: 3px; margin-top: 2px; cursor: pointer; text-shadow: var(--shadow); }
.chip.timed::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c); margin-right: 4px; vertical-align: 1px; }
.chip.allday { background: var(--c); color: #fff; }
.chip:hover { outline: 1px solid var(--hl); }
.more { font-size: 11px; color: var(--muted); padding-left: 5px; }
.week { display: grid; grid-template-rows: auto auto 1fr; min-height: 0; height: 100%; }
.whead, .wall { display: grid; grid-template-columns: 56px repeat(var(--days), 1fr); border-bottom: 1px dashed var(--line); }
.whead div { text-align: center; padding: 4px; font-size: 13px; cursor: pointer; }
.whead div b { display: block; font-size: 20px; text-shadow: var(--shadow); }
.whead div.today b { color: var(--hl); }
.wall > div { padding: 2px; border-left: 1px dashed var(--line); min-height: 26px; }
.wall > div:first-child { border-left: 0; font-size: 11px; color: var(--muted); padding-top: 6px; text-align: right; padding-right: 6px; }
.wscroll { overflow-y: auto; min-height: 0; }
.wgrid { display: grid; grid-template-columns: 56px repeat(var(--days), 1fr); position: relative; }
.hours div { height: 46px; font-size: 11px; color: var(--muted); text-align: right; padding-right: 6px; transform: translateY(-7px); }
.wcol { position: relative; border-left: 1px dashed var(--line); background: repeating-linear-gradient(180deg, transparent 0 45px, var(--line) 45px 46px); cursor: copy; }
.wcol.today { background-color: rgba(255,255,255,.05); }
.wev { position: absolute; border-radius: 4px; padding: 2px 5px; font-size: 12px; overflow: hidden; cursor: pointer; color: #fff; text-shadow: var(--shadow);
  background: color-mix(in srgb, var(--c) 85%, black); border-left: 4px solid var(--c); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.wev b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nowline { position: absolute; left: 0; right: 0; height: 2px; background: var(--bad); z-index: 3; }
.nowline::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }
.dayhead { padding: 10px 14px 4px; font-weight: bold; text-shadow: var(--shadow); border-bottom: 1px dashed var(--line); position: sticky; top: 0; background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 85%, white), var(--bg)); z-index: 1; }
.colorbar { width: 5px; align-self: stretch; border-radius: 3px; background: var(--c); flex: none; }
.form { display: grid; grid-template-columns: 110px 1fr; gap: 8px 10px; align-items: center; }
.form label { color: var(--muted); font-size: 14px; }
.form input:not([type=checkbox]), .form select, .form textarea { width: 100%; padding: 6px 8px; border-radius: 5px; border: 1px solid rgba(0,0,0,.4); background: #fff; color: #000; font: inherit; }
.form .pair { display: flex; gap: 6px; }
.form .seg { justify-self: start; }
.dialog.wide { width: min(560px, 94vw); }
.note-sm { font-size: 13px; color: var(--muted); }

@media (max-width: 900px) {
  .body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid rgba(0,0,0,.3); padding: 0; }
  nav button { width: auto; flex: none; }
  nav button span.lbl { display: none; }
  .split { grid-template-columns: 1fr; }
  .split .pane.detail:not(.open) { display: none; }
  .split.detailopen .pane.list { display: none; }
  .status { gap: 10px; }
  .softkeys .c { display: none; }
}
</style>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></symbol>
  <symbol id="i-msg" viewBox="0 0 24 24"><path d="M3 5h18v12H7l-4 4zM6 8v2h12V8zm0 4v2h9v-2z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M2 4h14v10H6l-4 4zm16 4h4v12l-4-4h-8v-2h8z"/></symbol>
  <symbol id="i-call" viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></symbol>
  <symbol id="i-person" viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-9 2-9 5v3h18v-3c0-3-5-5-9-5z"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 0 0 2.5-2.5h-5A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.8V3a1.5 1.5 0 0 0-3 0v1.2A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><path d="M7 2h2v2h6V2h2v2h3v18H4V4h3zm-1 7v11h12V9zm2 2h3v3H8z"/></symbol>
  <symbol id="i-cake" viewBox="0 0 24 24"><path d="M12 2c1 1.5 1.5 2.5 1.5 3.5a1.5 1.5 0 0 1-3 0C10.5 4.5 11 3.5 12 2zm-1 6h2v3h6a2 2 0 0 1 2 2v2c-1 0-1.5.8-2.5.8S16.7 15 15.5 15s-1.8.8-3 .8-1.8-.8-3-.8-1.8.8-3 .8S4.5 15 3 15v-2a2 2 0 0 1 2-2h6zm-8 9c1 0 1.7-.8 2.5-.8s1.5.8 3 .8 1.8-.8 3-.8 1.8.8 3 .8 1.8-.8 3-.8.8.8 2.5.8V22H3z"/></symbol>
  <symbol id="i-photo" viewBox="0 0 24 24"><path d="M3 5h18v14H3zm2 2v8.5l4-4 3 3 4-5 3 3.5V7zm4 3a1.5 1.5 0 1 0 0-.01z"/></symbol>
  <symbol id="i-card" viewBox="0 0 24 24"><path d="M2 5h20v14H2zm2 3v2h16V8zm0 5v4h7v-4z"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M9 2h6v2h4v18H5V4h4zm0 4H7v14h10V6h-2v2H9zm2-2v2h2V4z"/></symbol>

</svg>

<div id="app" class="hidden">
  <header class="status">
    <div class="signal" id="sig"><i></i><i></i><i></i><i></i></div>
    <span class="op" id="op">—</span>
    <span class="link-state" id="link">Connecting…</span>
    <span class="grow"></span>
    <span class="wx-mini" id="wxmini"></span>
    <span class="clock" id="clock">--:--</span>
    <span class="battery" id="bat"><span id="batpct">--%</span><span class="cell"><span class="fill" id="batfill" style="width:0%"></span></span></span>
  </header>
  <div id="callbar" class="callbar hidden"></div>
  <div class="body">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
  <footer class="softkeys">
    <button id="skL">Options</button>
    <span class="c" id="skC">Alt+0–9 sections · / search · Esc back</span>
    <button id="skR" class="r">Exit</button>
  </footer>
</div>

<div id="pair" class="overlay hidden">
  <div class="dialog">
    <h2>Connect to phone</h2>
    <div class="in">
      <div>On the phone, open <b>Menu → Settings → Desktop Mode</b> and enter the pairing code shown there.</div>
      <input id="code" class="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000">
      <div class="err" id="pairerr"></div>
      <div class="row2"><button class="btn" id="pairbtn">Connect</button></div>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

let token = store.get("symbian.token");
const S = {
  view: "home", status: null, weather: null, threads: [], thread: null, messages: [], notifs: [], calls: [], contacts: [],
  agenda: [], media: null, drafts: {}, wallet: [], clip: null, birthdays: [], calendars: [],
  photos: { items: [], total: 0, loading: false, sel: new Set(), selecting: false, permission: true },
  cal: { mode: store.get("symbian.calmode") || "month", date: new Date(), events: [], loaded: "" }, contact: null, chat: null, newMsg: false, q: "", online: false,
};

// ───────────── API ─────────────
async function api(path, body) {
  const opt = { headers: { "X-Token": token || "" } };
  if (body !== undefined) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch("/api/" + path, opt);
  if (r.status === 401) { showPair(); throw new Error("not paired"); }
  return r.json();
}
const q = s => encodeURIComponent(s);
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
async function act(path, body, okMsg) {
  try { const r = await api(path, body); if (r.ok === false) toast(r.error || "Failed"); else if (okMsg) toast(okMsg); return r; }
  catch (e) { toast("Phone not reachable"); return { ok: false }; }
}

// ───────────── Formatting ─────────────
const pad = n => String(n).padStart(2, "0");
const hm = t => { const d = new Date(t); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
function when(t) {
  const d = new Date(t), now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === now.toDateString()) return hm(t);
  if (d.toDateString() === y.toDateString()) return "Yesterday";
  if (now - d < 6 * 864e5) return d.toLocaleDateString(undefined, { weekday: "short" });
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
}
const dur = s => s >= 3600 ? `${Math.floor(s / 3600)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}` : `${Math.floor(s / 60)}:${pad(s % 60)}`;
const initials = n => (String(n || "?").trim().split(/\s+/).map(w => w[0]).filter(c => /\p{L}/u.test(c)).slice(0, 2).join("") || "#").toUpperCase();
function hue(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
const avatar = (name, img) => `<span class="avatar" style="background-color:hsl(${hue(name)} 45% 40%);${img ? `background-image:url('${img}')` : ""}">${img ? "" : esc(initials(name))}</span>`;
function wxIcon(sym) {
  sym = String(sym || "").toLowerCase().replace(/ /g, "_");
  const night = sym.includes("night");
  if (sym.includes("thunder")) return "⛈️";
  if (sym.includes("snow")) return "❄️";
  if (sym.includes("sleet")) return "🌨️";
  if (sym.includes("rain")) return "🌧️";
  if (sym.includes("fog")) return "🌫️";
  if (sym.includes("partlycloudy")) return night ? "☁️" : "⛅";
  if (sym.includes("fair")) return night ? "🌙" : "🌤️";
  if (sym.includes("clearsky")) return night ? "🌙" : "☀️";
  if (sym.includes("cloudy")) return "☁️";
  return "🌡️";
}
const icon = id => `<svg><use href="#i-${id}"/></svg>`;

// ───────────── Navigation ─────────────
const SECTIONS = [
  ["home", "Home", "home"], ["messages", "Messages", "msg"], ["chats", "Chats", "chat"], ["calls", "Calls", "call"],
  ["contacts", "Contacts", "person"], ["birthdays", "Birthdays", "cake"], ["photos", "Photos", "photo"], ["notifications", "Notifications", "bell"], ["calendar", "Calendar", "cal"], ["wallet", "Wallet", "card"], ["clipboard", "Clipboard", "clip"], ["tools", "Tools", "tool"],
];
function badges() {
  const unread = S.threads.reduce((a, t) => a + (t.unread || 0), 0);
  const chats = chatList().length;
  const seen = Number(store.get("symbian.callsSeen") || 0);
  const missed = S.calls.filter(c => c.type === "missed" && c.date > seen).length;
  return { messages: unread, chats, notifications: S.notifs.length, calls: missed, birthdays: S.birthdays.filter(b => b.days === 0).length };
}
function renderNav() {
  const b = badges();
  $("#nav").innerHTML = SECTIONS.map(([id, label, ic], i) =>
    `<button data-go="${id}" class="${S.view === id ? "active" : ""}" title="${label}${i < 10 ? ` (Alt+${(i + 1) % 10})` : ""}">${icon(ic)}<span class="lbl">${label}</span>${b[id] ? `<span class="badge">${b[id]}</span>` : ""}</button>`).join("");
}
function go(view) {
  S.view = view; S.q = "";
  if (view === "calls") store.set("symbian.callsSeen", String(Date.now()));
  render(); load(view);
  document.title = (SECTIONS.find(s => s[0] === view)?.[1] || "") + " · Symbian Desktop";
}
function load(view) {
  if (view === "home") { refresh("notifications"); refresh("threads"); refresh("agenda"); refresh("media"); refresh("calls"); }
  if (view === "messages") { refresh("threads"); if (S.thread) openThread(S.thread.thread, S.thread); }
  if (view === "chats" || view === "notifications") refresh("notifications");
  if (view === "calls") { refresh("calls"); refresh("contacts"); }
  if (view === "contacts") { refresh("contacts"); refresh("birthdays"); }
  if (view === "calendar") { loadCalendars(); loadCal(); }
  if (view === "birthdays") refresh("birthdays");
  if (view === "photos" && !S.photos.items.length) loadPhotos();
  if (view === "wallet") refresh("wallet");
  if (view === "clipboard") refresh("clipboard");
  if (view === "home") refresh("birthdays");
}
async function refresh(what) {
  try {
    if (what === "threads") S.threads = await api("threads");
    if (what === "notifications") { const fresh = await api("notifications"); announceNew(fresh); S.notifs = fresh; }
    if (what === "calls") S.calls = await api("calls");
    if (what === "contacts" && !S.contacts.length) S.contacts = await api("contacts");
    if (what === "contacts!") S.contacts = await api("contacts");
    if (what === "agenda") S.agenda = await api("agenda");
    if (what === "birthdays") S.birthdays = await api("birthdays");
    if (what === "wallet") S.wallet = await api("wallet");
    if (what === "clipboard") S.clip = await api("clipboard");
    if (what === "media") S.media = await api("media");
    if (what === "weather") S.weather = await api("weather");
    if (what === "status") S.status = await api("status");
    render();
  } catch (e) { /* offline; SSE reconnect will retry */ }
}

// ───────────── Rendering ─────────────
function setSoftkeys(left, leftFn, right = "Back", rightFn = () => back()) {
  const L = $("#skL"), R = $("#skR");
  L.textContent = left || ""; L.onclick = leftFn || null; L.style.visibility = left ? "visible" : "hidden";
  R.textContent = right; R.onclick = rightFn;
}
function back() {
  if (S.newMsg) { S.newMsg = false; return render(); }
  if (S.view === "messages" && S.thread) { S.thread = null; return render(); }
  if (S.view === "contacts" && S.contact) { S.contact = null; return render(); }
  if (S.view === "chats" && S.chat) { S.chat = null; return render(); }
  if (S.view !== "home") return go("home");
}

function render() {
  renderStatus(); renderNav();
  const m = $("#main");
  const keepScroll = [...m.querySelectorAll(".pane, .bubbles, .home")].map(e => e.scrollTop);
  const focusedId = document.activeElement?.id; const sel = document.activeElement?.selectionStart;
  m.innerHTML = VIEWS[S.view]();
  [...m.querySelectorAll(".pane, .home")].forEach((e, i) => { if (keepScroll[i] != null) e.scrollTop = keepScroll[i]; });
  const b = m.querySelector(".bubbles"); if (b && b.dataset.stick !== "0") b.scrollTop = b.scrollHeight;
  if (focusedId) { const f = document.getElementById(focusedId); if (f) { f.focus(); try { if (sel != null) f.setSelectionRange(sel, sel); } catch {} } }
  wire(m);
}

function renderStatus() {
  const st = S.status;
  if (st) {
    const lvl = st.signal ?? -1;
    [...$("#sig").children].forEach((b, i) => b.classList.toggle("on", i < lvl));
    $("#op").textContent = st.operator || st.device || "";
    if (st.battery != null) {
      $("#batpct").textContent = (st.charging ? "⚡" : "") + st.battery + "%";
      $("#batfill").style.width = st.battery + "%";
      $("#bat").classList.toggle("low", st.battery <= 15 && !st.charging);
    }
    renderCall(st.call);
  }
  const w = S.weather;
  $("#wxmini").innerHTML = w && w.symbol ? `${wxIcon(w.symbol)} <b>${Math.round(w.temp)}°</b>` : "";
  const l = $("#link"); l.textContent = S.online ? "Connected" : "Reconnecting…"; l.classList.toggle("off", !S.online);
}

let callTimer = null;
function renderCall(c) {
  const bar = $("#callbar");
  clearInterval(callTimer);
  if (!c || c.state === "idle") { bar.classList.add("hidden"); return; }
  bar.classList.remove("hidden"); bar.classList.toggle("ringing", c.state === "ringing");
  const who = esc(c.name || c.number || "Unknown");
  const paint = () => {
    const t = c.state === "active" && c.since ? " · " + dur(Math.floor((Date.now() - c.since) / 1000)) : "";
    bar.innerHTML = `${icon("call").replace("<svg>", '<svg style="width:22px;height:22px;fill:#fff">')}
      <b>${c.state === "ringing" ? "Incoming call" : "In call"}: ${who}</b><span>${t}</span><span style="flex:1"></span>
      ${c.state === "ringing" ? `<button class="btn good" data-call="answer">Answer</button><button class="btn bad" data-call="end">Reject</button>`
        : `<button class="btn" data-call="speaker">Speaker</button><button class="btn bad" data-call="end">End call</button>`}`;
  };
  paint();
  if (c.state === "active") callTimer = setInterval(paint, 1000);
}

const VIEWS = {
  home() {
    setSoftkeys("Ring phone", () => act("ring", { on: true }, "Ringing phone for 30 s"), "Exit", () => toast("Close this tab to exit"));
    const d = new Date(), w = S.weather, st = S.status || {};
    const unread = S.threads.filter(t => t.unread).slice(0, 4);
    const media = S.media;
    return `<div class="home">
      <div class="card"><h3>Today</h3><div class="in">
        <div class="bigclock" id="bigclock">${pad(d.getHours())}:${pad(d.getMinutes())}</div>
        <div class="bigdate">${esc(d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" }))}</div>
      </div></div>
      <div class="card"><h3>Weather${w && w.location ? " · " + esc(w.location) : ""}</h3><div class="in">
        ${w && w.symbol ? `<div class="wxnow"><span class="ic">${wxIcon(w.symbol)}</span><span class="temp">${Math.round(w.temp)}°${esc(w.unit || "")}</span>
          <div class="kv">${w.feelsLike != null ? `<span>Feels like</span><span>${Math.round(w.feelsLike)}°</span>` : ""}
          ${w.wind != null ? `<span>Wind</span><span>${w.wind} m/s</span>` : ""}${w.humidity != null ? `<span>Humidity</span><span>${Math.round(w.humidity)}%</span>` : ""}
          ${w.precip != null ? `<span>Rain (1 h)</span><span>${w.precip} mm</span>` : ""}</div></div>
          <div class="wxstrip">${(w.hourly || []).slice(0, 12).map(h => `<div>${esc(String(h.time).slice(-5))}<b>${wxIcon(h.symbol)}</b>${Math.round(h.temp)}°</div>`).join("")}</div>
          <div class="wxstrip">${(w.daily || []).slice(0, 7).map(h => `<div>${esc(dayName(h.time))}<b>${wxIcon(h.symbol)}</b>${h.high != null ? Math.round(h.high) + "°" : ""} <span style="opacity:.7">${h.low != null ? Math.round(h.low) + "°" : ""}</span></div>`).join("")}</div>`
          : `<div class="empty">Waiting for the phone's forecast…</div>`}
      </div></div>
      <div class="card"><h3>Messages</h3>${unread.length ? unread.map(t => threadRow(t)).join("") : `<div class="empty">No unread messages</div>`}
        <div class="in actions"><button class="btn" data-go="messages">Open messages</button><button class="btn" data-new="1">New message</button></div></div>
      <div class="card"><h3>Agenda</h3>${S.agenda.length ? S.agenda.slice(0, 5).map(agendaRow).join("") : `<div class="empty">Nothing more today</div>`}
        <div class="in actions"><button class="btn" data-go="calendar">Open calendar</button><button class="btn" data-newevent="">New event</button></div></div>
      <div class="card"><h3>Birthdays</h3>${S.birthdays.filter(b => b.days <= 14).slice(0, 4).map(birthdayRow).join("") || `<div class="empty">No birthdays in the next two weeks</div>`}</div>
      <div class="card"><h3>Notifications</h3>${S.notifs.length ? S.notifs.slice(0, 5).map(n => notifRow(n, true)).join("") : `<div class="empty">All clear</div>`}</div>
      <div class="card"><h3>Now playing</h3><div class="in">
        ${media && media.active ? `<div class="name" style="font-weight:bold">${esc(media.title || "Unknown")}</div><div class="sub" style="color:var(--muted)">${esc([media.artist, media.app].filter(Boolean).join(" · "))}</div>
          <div class="actions" style="margin-top:10px"><button class="btn" data-media="previous">⏮</button><button class="btn" data-media="toggle">${media.playing ? "⏸ Pause" : "▶ Play"}</button><button class="btn" data-media="next">⏭</button></div>`
          : `<div class="empty" style="padding:8px">Nothing playing</div>`}
      </div></div>
      <div class="card"><h3>Phone</h3><div class="in">
        <div class="kv"><span>Device</span><span>${esc(st.device || "")}</span><span>Battery</span><span>${st.battery ?? "–"}%${st.charging ? " (charging)" : ""}</span>
        <span>Storage free</span><span>${st.storageFree ? (st.storageFree / 1e9).toFixed(1) + " GB of " + (st.storageTotal / 1e9).toFixed(0) + " GB" : "–"}</span></div>
        ${st.storageTotal ? `<div class="meter" style="margin-top:8px"><i style="width:${100 - Math.round(st.storageFree / st.storageTotal * 100)}%"></i></div>` : ""}
        <div class="actions" style="margin-top:12px"><button class="btn" data-ring="1">Ring phone</button><button class="btn" data-go="tools">Send to phone…</button></div>
      </div></div>
    </div>`;
  },

  messages() {
    const list = S.threads.filter(t => !S.q || (t.name + " " + t.address + " " + t.snippet).toLowerCase().includes(S.q.toLowerCase()));
    setSoftkeys("New message", () => { S.newMsg = true; S.thread = null; render(); $("#to")?.focus(); });
    const perm = S.status?.permissions;
    return `<div class="view split ${S.thread || S.newMsg ? "detailopen" : ""}">
      <div class="pane list">
        <div class="title">${icon("msg").replace("<svg>", '<svg style="width:20px;height:20px;fill:var(--accent)">')}<span class="grow">Messages</span><button class="btn small" data-new="1">New</button></div>
        <div class="toolbar"><input class="search" id="search" placeholder="Search messages" value="${esc(S.q)}"></div>
        ${perm && !perm.sms ? `<div class="empty">SMS access is off on the phone. Turn Desktop Mode off and on again to grant it.</div>` : ""}
        ${list.length ? list.map(t => threadRow(t)).join("") : `<div class="empty">No conversations</div>`}
        <div class="empty" style="font-size:13px">RCS and app chats are under <a href="#" data-go="chats">Chats</a>. Full RCS history:
          <a href="https://messages.google.com/web" target="_blank" rel="noopener">Google Messages for Web</a></div>
      </div>
      <div class="pane detail ${S.thread || S.newMsg ? "open" : ""}">${S.newMsg ? newMessage() : S.thread ? conversation() : `<div class="empty">Select a conversation</div>`}</div>
    </div>`;
  },

  chats() {
    const list = chatList();

function dayName(s) { const d = new Date(String(s).slice(0, 10) + "T12:00"); return isNaN(d) ? String(s) : d.toLocaleDateString(undefined, { weekday: "short" }); }

}
function agendaRow(e) {

}
function chatList() { return S.notifs.filter(n => n.canReply || n.messaging); }
function lastText(n) { const m = n.messages && n.messages.length ? n.messages[n.messages.length - 1].text : n.text; return m || ""; }

function smsInfo(text) {
  const gsm = /^[@£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ !"#¤%&'()*+,\-./0-9:;<=>?¡A-ZÄÖÑÜ§¿a-zäöñüà^{}\\[~\]|€]*$/.test(text);
  const len = text.length, single = gsm ? 160 : 70, multi = gsm ? 153 : 67;
  const parts = len === 0 ? 0 : len <= single ? 1 : Math.ceil(len / multi);
  return `${len} · ${parts} SMS`;
}
function conversation() {
  const t = S.thread; let last = "";
  const bubbles = S.messages.map(m => {
    const day = new Date(m.date).toDateString(); const sep = day !== last ? `<div class="daysep">${esc(new Date(m.date).toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }))}</div>` : "";
    last = day;
    return sep + `<div class="bubble ${m.outgoing ? "out" : "in"} ${m.failed ? "failed" : ""}">${mediaHtml(m.media)}${esc(m.body)}<span class="t">${hm(m.date)}${m.pending ? " · sending" : ""}${m.failed ? " · failed" : ""}</span></div>`;
  }).join("");
  return `<div class="convo">
    <div class="title">${avatar(t.name)}<span class="grow">${esc(t.name)}<div style="font-size:12px;font-weight:normal;color:var(--muted)">${esc(t.address)}</div></span>
      <button class="btn small good" data-callnum="${esc(t.address)}">Call</button></div>
    <div class="bubbles" id="bubbles">${bubbles || `<div class="empty">Loading…</div>`}</div>
    <div class="compose"><textarea id="reply" placeholder="Text message" rows="1"></textarea><span class="counter" id="counter"></span><button class="btn" data-sendsms="1">Send</button></div>
  </div>`;
}
function mediaHtml(list) {
  return (list || []).map(p => {
    const src = `/api/mmspart?id=${p.id}&token=${q(token)}`;
    if (p.type.startsWith("image/")) return `<img class="mms" src="${src}" data-zoom="${src}" alt="Photo">`;
    if (p.type.startsWith("video/")) return `<video class="mms" src="${src}" controls preload="metadata"></video>`;
    return `<audio src="${src}" controls preload="none"></audio>`;
  }).join("");
}

function chatView(n) {
  const msgs = n.messages && n.messages.length ? n.messages : [{ text: n.text, sender: n.title, time: n.time }];
  return `<div class="convo">
    <div class="title"><img class="appicon" onerror="this.style.visibility='hidden'" src="/api/icon?pkg=${q(n.pkg)}&token=${q(token)}" alt=""><span class="grow">${esc(n.title || n.app)}<div style="font-size:12px;font-weight:normal;color:var(--muted)">${esc(n.app)}</div></span>
      ${n.clearable ? `<button class="btn small" data-dismiss="${esc(n.key)}">Dismiss</button>` : ""}</div>
    <div class="bubbles">${msgs.map(m => `<div class="bubble ${m.sender ? "in" : "out"}">${m.sender && m.sender !== n.title ? `<b>${esc(m.sender)}</b>\n` : ""}${esc(m.text)}<span class="t">${m.time ? hm(m.time) : ""}</span></div>`).join("")}</div>
    ${n.canReply ? `<div class="compose"><textarea id="reply" placeholder="Reply via ${esc(n.app)}" rows="1"></textarea><button class="btn" data-chatreply="${esc(n.key)}">Send</button></div>`
      : `<div class="empty">This app doesn't allow replies from notifications.</div>`}
  </div>`;

async function openThread(id, meta) {
  S.thread = meta || S.threads.find(t => t.thread === id) || { thread: id, name: "", address: "" };
  S.newMsg = false;
  if (!meta || S.messages[0]?.thread !== id) render();
  try { S.messages = (await api("messages?thread=" + id)).map(m => ({ ...m, thread: id })); } catch {}
  render(); $("#reply")?.focus();
}
function dial() { const n = ($("#dialnum")?.value || S.dial || "").trim(); if (n) act("call", { number: n }, "Calling " + n + "…"); }

// ───────────── Events ─────────────
function wire(m) {
  m.querySelectorAll("[data-thread]").forEach(b => b.onclick = () => { if (S.view !== "messages") { S.view = "messages"; } openThread(Number(b.dataset.thread)); });
  m.querySelectorAll("[data-new]").forEach(b => b.onclick = () => { S.view = "messages"; S.newMsg = true; S.thread = null; render(); refresh("contacts"); $("#to")?.focus(); });
  m.querySelectorAll("[data-contact]").forEach(b => b.onclick = () => { S.contact = b.dataset.contact; render(); });
  m.querySelectorAll("[data-chat]").forEach(b => b.onclick = () => { S.chat = b.dataset.chat; render(); $("#reply")?.focus(); });
  m.querySelectorAll("[data-openchat]").forEach(b => b.onclick = () => { S.chat = b.dataset.openchat; go("chats"); setTimeout(() => $("#reply")?.focus(), 50); });
  m.querySelectorAll("[data-callnum]").forEach(b => b.onclick = () => act("call", { number: b.dataset.callnum }, "Calling…"));
  m.querySelectorAll("[data-textnum]").forEach(b => b.onclick = () => startText(b.dataset.textnum));
  m.querySelectorAll("[data-dial]").forEach(b => b.onclick = () => { S.dial = b.dataset.dial; render(); });
  m.querySelectorAll("[data-key]:not([data-naction])").forEach(b => b.onclick = () => {
    const i = $("#dialnum"); const k = b.dataset.key; i.value = k === "⌫" ? i.value.slice(0, -1) : i.value + k; S.dial = i.value; i.focus();
  });
  m.querySelectorAll("[data-dialnow]").forEach(b => b.onclick = dial);
  m.querySelectorAll("[data-sms-to]").forEach(b => b.onclick = () => { const n = ($("#dialnum")?.value || "").trim(); if (n) startText(n); });
  m.querySelectorAll("[data-dismiss]").forEach(b => b.onclick = async () => { await act("notifications/dismiss", { key: b.dataset.dismiss }); if (S.chat === b.dataset.dismiss) S.chat = null; refresh("notifications"); });
  m.querySelectorAll("[data-naction]").forEach(b => b.onclick = () => act("notifications/action", { key: b.dataset.key, index: Number(b.dataset.naction) }, "Done"));
  m.querySelectorAll("[data-clearall]").forEach(b => b.onclick = async () => { await act("notifications/clear", {}); refresh("notifications"); });
  m.querySelectorAll("[data-media]").forEach(b => b.onclick = () => act("media/" + b.dataset.media, {}));
  m.querySelectorAll("[data-ring]").forEach(b => b.onclick = () => act("ring", { on: b.dataset.ring === "1" }, b.dataset.ring === "1" ? "Ringing phone for 30 s" : "Stopped"));
  m.querySelectorAll("[data-send]").forEach(b => b.onclick = async () => {
    const t = $("#note").value.trim(); if (!t) return;
    const r = await act(b.dataset.send === "clip" ? "clipboard" : "send", { text: t }, b.dataset.send === "clip" ? "Copied to phone" : "Sent to phone");
    if (r.ok) $("#note").value = "";
  });
  m.querySelectorAll("[data-unpair]").forEach(b => b.onclick = () => { store.del("symbian.token"); token = null; es && es.close(); showPair(); });
  m.querySelectorAll("[data-alerts]").forEach(b => b.onclick = async () => { if ("Notification" in window) { await Notification.requestPermission(); render(); } });
  m.querySelectorAll("a[data-go]").forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.go); });
  m.querySelectorAll("button[data-go]").forEach(a => a.onclick = () => go(a.dataset.go));

  const search = $("#search", m);
  if (search) search.oninput = () => { S.q = search.value; render(); };
  const reply = $("#reply", m);
  if (reply) {
    const counter = $("#counter", m);
    const grow = () => { reply.style.height = "auto"; reply.style.height = Math.min(reply.scrollHeight, 160) + "px"; if (counter) counter.textContent = smsInfo(reply.value); };
    const dk = draftKey(); reply.value = S.drafts[dk] || ""; grow();
    reply.oninput = () => { S.drafts[dk] = reply.value; grow(); };
    reply.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); m.querySelector("[data-sendsms],[data-sendnew],[data-chatreply]")?.click(); } };
  }
  m.querySelectorAll("[data-sendsms]").forEach(b => b.onclick = () => sendSms(S.thread.address));
  m.querySelectorAll("[data-sendnew]").forEach(b => b.onclick = () => sendSms(resolveTo($("#to").value)));
  m.querySelectorAll("[data-chatreply]").forEach(b => b.onclick = async () => {
    const t = $("#reply").value.trim(); if (!t) return;
    b.disabled = true; const r = await act("notifications/reply", { key: b.dataset.chatreply, text: t }, "Reply sent");
    b.disabled = false; if (r.ok) { S.drafts[draftKey()] = ""; $("#reply").value = ""; }
  });
  const to = $("#to", m);
  if (to) {
    to.oninput = () => {
      S.to = to.value; const v = to.value.toLowerCase().trim(); const box = $("#suggest");
      const hits = v ? S.contacts.filter(c => c.name.toLowerCase().includes(v) || c.numbers.some(n => n.number.replace(/\s/g, "").includes(v.replace(/\s/g, "")))).slice(0, 8) : [];
      box.classList.toggle("hidden", !hits.length);
      box.innerHTML = hits.flatMap(c => c.numbers.map(n => `<button class="row" data-pick="${esc(n.number)}" data-name="${esc(c.name)}">${avatar(c.name)}<span class="main"><span class="name">${esc(c.name)}</span><span class="sub">${esc(n.number)} ${esc(n.label)}</span></span></button>`)).join("");
      box.querySelectorAll("[data-pick]").forEach(p => p.onclick = () => { to.value = `${p.dataset.name} <${p.dataset.pick}>`; S.to = to.value; box.classList.add("hidden"); $("#reply").focus(); });
    };
  }
  const drop = $("#drop", m);
  if (drop) {
    const files = $("#files", m);
    $("#pick", m).onclick = e => { e.preventDefault(); files.click(); };
    files.onchange = () => upload([...files.files]);
    drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); upload([...e.dataTransfer.files]); };
  }
  wireCalendar(m);
  wirePhotos(m);
  wireWallet(m);
  wireClipboard(m);
  m.querySelectorAll("[data-zoom]").forEach(i => i.onclick = () => window.open(i.dataset.zoom, "_blank"));
  m.querySelectorAll("[data-alertpref]").forEach(c => c.onchange = () => { const p = alertPrefs(); p[c.dataset.alertpref] = c.checked; store.set("symbian.alerts", JSON.stringify(p)); });
  const rb = $("[data-restore]", m);
  if (rb) {

  const key = e => { if (!document.body.contains(box)) return document.removeEventListener("keydown", key);
    if (e.key === "ArrowRight" && i < items.length - 1) { i++; show(); } if (e.key === "ArrowLeft" && i > 0) { i--; show(); } };
  document.addEventListener("keydown", key);
  show();
}

// ───────────── Clipboard ─────────────
let clipPending = null, clipPoll = null, lastComputerClip = null;
function clipboardView() {
  const c = S.clip || { history: [] };
  setSoftkeys("Send to phone", () => $("#clipsend")?.click());
  const phone = c.history.find(h => h.source === "phone");
  const cmds = [`adb shell pm grant ${c.package || "no.kianosh.symbianlauncher"} android.permission.READ_LOGS`, `adb shell appops set ${c.package || "no.kianosh.symbianlauncher"} SYSTEM_ALERT_WINDOW allow`];
  return `<div class="home">
    <div class="card"><h3>Clipboard sharing</h3><div class="in">
      <label class="switch"><input type="checkbox" id="clipsync" ${c.sync ? "checked" : ""}><i></i> Share the clipboard both ways</label>
      <p class="note-sm">Copy on the phone → it's on this computer's clipboard. Copy on this computer → it's on the phone's.</p>
      ${c.sync ? `<div class="kv" style="margin-top:8px"><span>Phone → computer</span><span>${c.instant ? "Instant ✓" : "When you return to the phone's home screen"}</span>
        <span>Computer → phone</span><span>${navigator.clipboard?.readText ? "Instant while this tab is open" : "Use \"Send to phone\" below"}</span></div>
        ${navigator.clipboard?.readText ? `<button class="btn small" id="clipallow" style="margin-top:8px">Allow this page to read the computer's clipboard</button>` : ""}` : ""}
    </div></div>
    <div class="card"><h3>Phone clipboard</h3><div class="in">
      ${phone ? `<div class="clipnow">${esc(phone.text)}</div><div class="actions" style="margin-top:8px"><button class="btn" data-copytext="${esc(phone.text)}">Copy to this computer</button><span class="note-sm">${when(phone.time)}</span></div>`
        : `<div class="empty" style="padding:8px">Nothing yet. Copy something on the phone${c.instant ? "" : ", then press Home"}.</div>`}
    </div></div>
    <div class="card"><h3>Send to phone</h3><div class="in">
      <textarea class="note" id="cliptext" placeholder="Type or paste text"></textarea>
      <div class="actions" style="margin-top:8px"><button class="btn" id="clipsend">Copy to phone clipboard</button></div></div></div>
    <div class="card" style="grid-column:1/-1"><h3>History</h3>
      ${c.history.length ? c.history.map(h => `<div class="row" style="cursor:default;align-items:flex-start">
        <span class="meta" style="min-width:84px;text-align:left">${h.source === "phone" ? "📱 Phone" : "💻 Computer"}<br>${when(h.time)}</span>
        <span class="main"><span class="sub" style="white-space:pre-wrap;color:var(--text);max-height:4.2em;overflow:hidden">${esc(h.text)}</span></span>
        <button class="btn small" data-copytext="${esc(h.text)}">Copy here</button>${h.source === "phone" ? "" : `<button class="btn small" data-tophone="${esc(h.text)}">To phone</button>`}</div>`).join("")
        : `<div class="empty">Copied text will appear here</div>`}
    </div>
    ${c.sync && !c.instant ? `<div class="card" style="grid-column:1/-1"><h3>Make phone → computer instant (one-time setup)</h3><div class="in">
      <p style="margin-top:0">Android only lets the app in front read the clipboard. With two extra permissions, granted once over USB, the launcher can catch every copy straight away. Connect the phone with USB debugging on, then run on the computer:</p>
      ${cmds.map(x => `<code class="cmd">${esc(x)}</code>`).join("")}
      <div class="actions"><button class="btn small" data-copytext="${esc(cmds.join("\n"))}">Copy commands</button></div>
      <p class="note-sm">${c.readLogs ? "✓ Log access granted" : "✕ Log access missing"} · ${c.overlay ? "✓ Display over other apps granted" : "✕ Display over other apps missing"}. Afterwards switch sharing off and on again.</p></div></div>` : ""}
  </div>`;
}
async function copyHere(text) {
  try { await navigator.clipboard.writeText(text); lastComputerClip = text; toast("Copied to this computer"); return true; }
  catch { toast("The browser blocked clipboard access — click the page and try again"); return false; }
}
function wireClipboard(m) {
  m.querySelectorAll("[data-copytext]").forEach(b => b.onclick = () => copyHere(b.dataset.copytext));
  m.querySelectorAll("[data-tophone]").forEach(b => b.onclick = () => act("clipboard", { text: b.dataset.tophone }, "On the phone's clipboard"));
  const send = $("#clipsend", m);
  if (send) send.onclick = async () => { const t = $("#cliptext").value; if (!t) return; const r = await act("clipboard", { text: t }, "On the phone's clipboard"); if (r.ok) { $("#cliptext").value = ""; refresh("clipboard"); } };
  const sw = $("#clipsync", m);
  if (sw) sw.onchange = async () => { S.clip = await act("clipboard/settings", { sync: sw.checked }); setupClipPoll(); render(); };
  const allow = $("#clipallow", m);
  if (allow) allow.onclick = async () => { try { await navigator.clipboard.readText(); toast("Allowed"); } catch { toast("Not allowed — check the browser's site permissions"); } };
}
function onPhoneClip(c) {
  if (S.clip) { S.clip.history = [c, ...S.clip.history.filter(h => h.text !== c.text)].slice(0, 50); S.clip.sync = c.sync; }
  if (c.source === "phone" && c.sync) {
    lastComputerClip = c.text;
    if (document.hasFocus()) navigator.clipboard?.writeText(c.text).catch(() => { clipPending = c.text; });
    else clipPending = c.text;
  }
  if (S.view === "clipboard") render();
}
window.addEventListener("focus", () => {
  if (clipPending != null) { const t = clipPending; clipPending = null; navigator.clipboard?.writeText(t).then(() => toast("Phone clipboard copied here")).catch(() => {}); }
});
// Computer → phone: while the tab is focused, notice new clipboard text and send it.
function setupClipPoll() {
  clearInterval(clipPoll);
  if (!S.clip?.sync || !navigator.clipboard?.readText) return;
  clipPoll = setInterval(async () => {
    if (!document.hasFocus() || !S.clip?.sync) return;
    try {
      const t = await navigator.clipboard.readText();
      if (t && t !== lastComputerClip) { lastComputerClip = t; await api("clipboard", { text: t }); }
    } catch {}
  }, 1500);
}
document.addEventListener("copy", () => setTimeout(async () => {
  if (!S.clip?.sync) return;
  try { const t = await navigator.clipboard.readText(); if (t && t !== lastComputerClip) { lastComputerClip = t; api("clipboard", { text: t }); } } catch {}
}, 50));

async function eventDialog(ev, at) {
  if (!S.calendars.length) await loadCalendars();
  const editable = !ev || (ev.writable && !ev.recurring);
  let start, end;
  if (ev) { start = new Date(ev.start); end = new Date(ev.end); if (ev.allDay) { const u = x => new Date(x.getUTCFullYear(), x.getUTCMonth(), x.getUTCDate()); start = u(start); end = addDays(u(end), -1); } }
  else { start = at || (() => { const d = new Date(); d.setMinutes(0, 0, 0); d.setHours(d.getHours() + 1); return d; })(); end = new Date(start.getTime() + 36e5); }
  const writable = S.calendars.filter(c => c.writable);
  const defCal = (writable.find(c => c.default) || writable[0] || {}).id;
  const o = dialog(`<h2>${ev ? (editable ? "Edit event" : esc(ev.title)) : "New event"}</h2><div class="in">
    ${ev && !editable ? `<div class="note-sm">${ev.recurring ? "Repeating event — edit it on the phone or in Google Calendar." : "This calendar is read-only."}</div>` : ""}
    <div class="form">
      <label>Title</label><input id="ev-title" value="${esc(ev ? ev.title : "")}" ${editable ? "" : "disabled"} placeholder="Event title">
      <label>All day</label><span><input type="checkbox" id="ev-allday" ${ev && ev.allDay ? "checked" : ""} ${editable ? "" : "disabled"}></span>
      <label>Starts</label><span class="pair"><input type="date" id="ev-sd" value="${toDateInput(start)}" ${editable ? "" : "disabled"}><input type="time" id="ev-st" value="${toTimeInput(start)}" ${editable ? "" : "disabled"}></span>
      <label>Ends</label><span class="pair"><input type="date" id="ev-ed" value="${toDateInput(end)}" ${editable ? "" : "disabled"}><input type="time" id="ev-et" value="${toTimeInput(end)}" ${editable ? "" : "disabled"}></span>
      <label>Location</label><input id="ev-loc" value="${esc(ev ? ev.location : "")}" ${editable ? "" : "disabled"}>
      <label>Notes</label><textarea id="ev-desc" rows="3" ${editable ? "" : "disabled"}>${esc(ev ? ev.description : "")}</textarea>
      <label>Calendar</label>${ev ? `<span>${esc(ev.calendar)}</span>` : `<select id="ev-cal">${writable.map(c => `<option value="${c.id}" ${c.id === defCal ? "selected" : ""}>${esc(c.name)}${c.account && c.account !== c.name ? " (" + esc(c.account) + ")" : ""}</option>`).join("")}</select>`}
      ${editable ? `<label>Reminder</label><select id="ev-rem">${[["-1", "None"], ["0", "At start"], ["10", "10 minutes before"], ["30", "30 minutes before"], ["60", "1 hour before"], ["1440", "1 day before"]].map(([v, l]) => `<option value="${v}" ${v === (ev ? "-1" : "30") ? "selected" : ""}>${l}</option>`).join("")}</select>` : ""}
    </div>
    <div class="err" id="ev-err"></div>
    <div class="row2">${ev && ev.writable ? `<button class="btn bad" id="ev-del">Delete${ev.recurring ? " series" : ""}</button><span style="flex:1"></span>` : ""}
      <button class="btn" id="ev-cancel">${editable ? "Cancel" : "Close"}</button>${editable ? `<button class="btn good" id="ev-save">Save</button>` : ""}</div></div>`, true);
  const allday = $("#ev-allday", o);
  const sync = () => { $("#ev-st", o).style.display = $("#ev-et", o).style.display = allday.checked ? "none" : ""; };
  allday.onchange = sync; sync();
  $("#ev-sd", o).onchange = () => { if ($("#ev-ed", o).value < $("#ev-sd", o).value) $("#ev-ed", o).value = $("#ev-sd", o).value; };
  $("#ev-cancel", o).onclick = () => o.remove();
  if (editable) setTimeout(() => $("#ev-title", o).focus(), 30);
  const del = $("#ev-del", o);
  if (del) del.onclick = async () => {
    if (!del.dataset.sure) { del.dataset.sure = "1"; del.textContent = ev.recurring ? "Delete every occurrence?" : "Confirm delete"; return; }
    const r = await act("calendar/delete", { id: ev.id }, "Event deleted"); if (r.ok) { o.remove(); loadCal(true); refresh("agenda"); }
  };
  const save = $("#ev-save", o);
  if (save) {
    $("#ev-title", o).onkeydown = e => { if (e.key === "Enter") save.click(); };
    save.onclick = async () => {
      const body = { title: $("#ev-title", o).value, allDay: allday.checked, location: $("#ev-loc", o).value, description: $("#ev-desc", o).value, reminder: Number($("#ev-rem", o).value) };
      if (ev) { body.id = ev.id; body.recurring = ev.recurring; } else body.calendarId = Number($("#ev-cal", o)?.value || 0);
      if (body.allDay) { body.date = $("#ev-sd", o).value; body.endDate = $("#ev-ed", o).value; }
      else {
        body.start = new Date(`${$("#ev-sd", o).value}T${$("#ev-st", o).value || "00:00"}`).getTime();
        body.end = new Date(`${$("#ev-ed", o).value}T${$("#ev-et", o).value || "00:00"}`).getTime();
        if (!(body.end > body.start)) { $("#ev-err", o).textContent = "The end must be after the start"; return; }
      }
      if (!body.title.trim()) { $("#ev-err", o).textContent = "Give the event a title"; return; }
      save.disabled = true;
      const r = await act("calendar", body, ev ? "Event updated" : "Event added");
      save.disabled = false;
      if (r.ok) { o.remove(); loadCal(true); refresh("agenda"); } else $("#ev-err", o).textContent = r.error || "Could not save";
    };
  }
}

// ───────────── Birthdays ─────────────
const daysText = n => n === 0 ? "today 🎉" : n === 1 ? "tomorrow" : `in ${n} days`;
function birthdayRow(b) {
  return `<button class="row" data-greet="${esc(b.id)}">${avatar(b.name, b.photo ? `/api/photo?id=${q(b.id)}&token=${q(token)}` : "")}
    <span class="main"><span class="name">${esc(b.name)}${b.days === 0 ? " 🎂" : ""}</span><span class="sub">${esc(b.date)}${b.turning ? " · turning " + b.turning : ""}</span></span>
    <span class="meta">${b.days === 0 ? `<span class="badge">Today</span>` : esc(daysText(b.days))}</span></button>`;
}
function birthdaysView() {
  setSoftkeys("");
  const groups = [["Today", b => b.days === 0], ["This week", b => b.days > 0 && b.days <= 7], ["This month", b => b.days > 7 && b.days <= 31], ["Later", b => b.days > 31]];
  const body = groups.map(([label, f]) => { const l = S.birthdays.filter(f); return l.length ? `<div class="dayhead">${label}</div>` + l.map(birthdayRow).join("") : ""; }).join("");
  return `<div class="view"><div class="pane">
    <div class="title">${icon("cake").replace("<svg>", '<svg style="width:20px;height:20px;fill:var(--accent)">')}<span class="grow">Birthdays</span><span style="font-size:13px;color:var(--muted)">${S.birthdays.length} contacts</span></div>
    ${body || `<div class="empty">No contacts have a birthday saved</div>`}</div></div>`;
}
function greetingText(b, lang) {
  const first = String(b.name).split(/\s+/)[0];
  if (lang === "en") return b.turning ? `Happy birthday, ${first}! 🎉 ${b.turning} looks good on you — hope you have a wonderful day.` : `Happy birthday, ${first}! 🎉 Hope you have a wonderful day.`;
  return b.turning ? `Gratulerer så mye med ${b.turning}-årsdagen, ${first}! 🎉 Håper du får en fin dag.` : `Gratulerer så mye med dagen, ${first}! 🎉 Håper du får en fin dag.`;
}
function greetDialog(id) {
  const b = S.birthdays.find(x => x.id === id); if (!b) return;
  let lang = store.get("symbian.greetlang") || "no";
  const o = dialog(`<h2>🎂 ${esc(b.name)}</h2><div class="in">
    <div class="note-sm">${esc(b.date)} · ${esc(daysText(b.days))}${b.turning ? " · turning " + b.turning : ""}</div>
    ${b.numbers.length ? `<div class="form"><label>Send to</label><select id="g-to">${b.numbers.map(n => `<option value="${esc(n.number)}">${esc(n.number)} ${esc(n.label)}</option>`).join("")}</select>
      <label>Language</label><span class="seg"><button class="btn small ${lang === "no" ? "on" : ""}" data-lang="no">Norsk</button><button class="btn small ${lang === "en" ? "on" : ""}" data-lang="en">English</button></span></div>
      <textarea class="note" id="g-text">${esc(greetingText(b, lang))}</textarea>
      <div class="note-sm" id="g-count"></div>` : `<div class="empty">This contact has no phone number.</div>`}
    <div class="err" id="g-err"></div>
    <div class="row2">${b.days > 0 ? `<button class="btn" id="g-remind">Remind me on the day</button><span style="flex:1"></span>` : ""}
      <button class="btn" id="g-cancel">Cancel</button>${b.numbers.length ? `<button class="btn good" id="g-send">Send SMS${b.days > 0 ? " now" : ""}</button>` : ""}</div></div>`);
  const txt = $("#g-text", o), count = () => { if ($("#g-count", o)) $("#g-count", o).textContent = smsInfo(txt.value); };
  if (txt) { txt.oninput = count; count(); setTimeout(() => { txt.focus(); txt.setSelectionRange(txt.value.length, txt.value.length); }, 30); }
  o.querySelectorAll("[data-lang]").forEach(x => x.onclick = () => {
    lang = x.dataset.lang; store.set("symbian.greetlang", lang); txt.value = greetingText(b, lang); count();
    o.querySelectorAll("[data-lang]").forEach(y => y.classList.toggle("on", y === x));
  });
  $("#g-cancel", o).onclick = () => o.remove();
  const send = $("#g-send", o);
  if (send) send.onclick = async () => {
    send.disabled = true; const r = await act("sms", { to: $("#g-to", o).value, body: txt.value.trim() }, "Greeting sent 🎉"); send.disabled = false;
    if (r.ok) o.remove(); else $("#g-err", o).textContent = r.error || "Could not send";
  };
  const rem = $("#g-remind", o);
  if (rem) rem.onclick = async () => {
    const d = addDays(startOfDay(new Date()), b.days); d.setHours(9);
    const r = await act("calendar", { title: `🎂 ${b.name}'s birthday${b.turning ? " (" + b.turning + ")" : ""}`, start: d.getTime(), end: d.getTime() + 15 * 6e4, reminder: 0, description: "Send a greeting from Symbian Desktop → Birthdays" }, "Reminder added to your calendar");
    if (r.ok) o.remove();
  };
}

// ───────────── Live stream ─────────────
let es = null;
function connect() {
  es && es.close();
  es = new EventSource("/api/events?token=" + q(token));
  es.onopen = () => { S.online = true; renderStatus(); load(S.view); refresh("weather"); refresh("threads"); refresh("notifications"); refresh("calls"); };
  es.onerror = async () => {
    S.online = false; renderStatus();
    try { const h = await (await fetch("/api/hello?token=" + q(token))).json(); if (!h.paired) { es.close(); showPair(); } } catch {}
  };
  es.addEventListener("status", e => { S.status = JSON.parse(e.data); renderStatus(); });
  es.addEventListener("weather", e => { S.weather = JSON.parse(e.data); if (S.view === "home") render(); else renderStatus(); });
  es.addEventListener("theme", e => applyTheme(JSON.parse(e.data)));
  es.addEventListener("media", e => { S.media = JSON.parse(e.data); if (S.view === "home") render(); });
  es.addEventListener("call", e => {
    const c = JSON.parse(e.data); S.status = { ...(S.status || {}), call: c }; renderCall(c);
    if (c.state === "ringing" && alertPrefs().calls) alertUser("Incoming call", c.name || c.number, null, null, true);
  });
  es.addEventListener("calls", () => refresh("calls"));
  es.addEventListener("sms", async () => {
    const before = S.threads.reduce((a, t) => a + (t.unread || 0), 0);
    await refresh("threads");
    const after = S.threads.reduce((a, t) => a + (t.unread || 0), 0);
    if (after > before && alertPrefs().sms) { const t = S.threads.find(x => x.unread); alertUser(t ? t.name : "New message", t ? t.snippet : "", null, () => { if (t) openThread(t.thread, t); }); }
    if (S.thread) openThread(S.thread.thread, S.thread);
  });
  es.addEventListener("sms_status", e => { const r = JSON.parse(e.data); if (!r.ok) toast("Message failed to send"); });
  es.addEventListener("notifications", () => refresh("notifications"));
  es.addEventListener("wallet", () => { if (S.view === "wallet") refresh("wallet"); });
  es.addEventListener("clipboard", e => onPhoneClip(JSON.parse(e.data)));
  es.addEventListener("calendar", () => { refresh("agenda"); if (S.view === "calendar") loadCal(true); });
}
function alertPrefs() {
  let p = {}; try { p = JSON.parse(store.get("symbian.alerts") || "{}"); } catch {}
  return { sms: true, calls: true, chats: true, other: false, ...p };
}
function alertUser(title, body, icon, onClick, urgent) {
  const canPop = "Notification" in window && Notification.permission === "granted" && window.isSecureContext;
  if (document.hidden && canPop) {
    try {
      const n = new Notification(title, { body, icon: icon || undefined, tag: "symbian-" + title, requireInteraction: !!urgent });
      n.onclick = () => { window.focus(); n.close(); onClick && onClick(); };
      return;
    } catch {}
  }
  if (!document.hidden || !canPop) toast(`${title}${body ? ": " + body : ""}`);
}
let seenNotifs = null;
function announceNew(list) {
  const prev = seenNotifs; seenNotifs = new Map(list.map(n => [n.key, n.time]));
  if (!prev) return; // first load: nothing is "new"
  const p = alertPrefs();
  for (const n of list) {
    if (n.ongoing || (prev.has(n.key) && prev.get(n.key) >= n.time)) continue;
    if (n.pkg === "com.google.android.apps.messaging" && !n.canReply) continue;
    const isChat = n.canReply || n.messaging;
    if (isChat ? !p.chats : !p.other) continue;
    const icon = `/api/icon?pkg=${q(n.pkg)}&token=${q(token)}`;
    alertUser(n.title || n.app, n.text, icon, () => { if (isChat) { S.chat = n.key; go("chats"); } else go("notifications"); });
  }
}
function confirmOnce(btn, msg) { return window.confirm(msg); }

function applyTheme(t) {
  const r = document.documentElement.style;
  if (t.background) r.setProperty("--bg", t.background);
  if (t.surface) r.setProperty("--surface", t.surface);
  if (t.text) r.setProperty("--text", t.text);
  if (t.accent) r.setProperty("--accent", t.accent);
  if (t.highlight) r.setProperty("--hl", t.highlight);
}

// ───────────── Pairing & start ─────────────
function showPair() {
  $("#app").classList.add("hidden"); $("#pair").classList.remove("hidden");
  setTimeout(() => $("#code").focus(), 50);
}
async function pair() {
  const code = $("#code").value.replace(/\D/g, "");
  if (code.length !== 6) { $("#pairerr").textContent = "Enter the 6-digit code"; return; }
  try {
    const r = await (await fetch("/api/pair", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) })).json();
    if (!r.ok) { $("#pairerr").textContent = r.error || "Wrong code"; return; }
    token = r.token; store.set("symbian.token", token); $("#code").value = ""; $("#pairerr").textContent = "";
    start();
  } catch { $("#pairerr").textContent = "Phone not reachable"; }
}
$("#pairbtn").onclick = pair;
$("#code").onkeydown = e => { if (e.key === "Enter") pair(); };
$("#code").oninput = e => { if (e.target.value.replace(/\D/g, "").length === 6) pair(); };

async function start() {
  try {
    const h = await (await fetch("/api/hello?token=" + q(token || ""))).json();
    if (!h.paired) return showPair();
  } catch { return showPair(); }
  $("#pair").classList.add("hidden"); $("#app").classList.remove("hidden");
  try { applyTheme(await api("theme")); } catch {}
  refresh("status"); refresh("weather");
  try { S.clip = await api("clipboard"); setupClipPoll(); } catch {}
  go("home");
  connect();
}
setInterval(() => {
  const d = new Date(); $("#clock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
  const b = $("#bigclock"); if (b) b.textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
}, 1000);
start();
</script>
