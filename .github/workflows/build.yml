name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 2.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key configured; building with a debug key."
          fi

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk symbian-launcher.apk
          cp clock/build/outputs/apk/release/clock-release.apk symbian-clock.apk
          cp snake/build/outputs/apk/release/snake-release.apk symbian-snake.apk
          cp blocks/build/outputs/apk/release/blocks-release.apk symbian-blocks.apk
          cp music/build/outputs/apk/release/music-release.apk symbian-music.apk
          ls -l symbian-launcher.apk symbian-clock.apk symbian-snake.apk symbian-blocks.apk symbian-music.apk

      - uses: actions/upload-artifact@v4
        with:
          name: symbian-launcher-${{ env.VERSION_NAME }}
          path: |
            symbian-launcher.apk
            symbian-clock.apk
            symbian-snake.apk
            symbian-blocks.apk
            symbian-music.apk

      - name: Publish release
        if: env.KEYSTORE_PATH != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Symbian Launcher ${{ env.VERSION_NAME }}
          files: |
            symbian-launcher.apk
            symbian-clock.apk
            symbian-snake.apk
            symbian-blocks.apk
            symbian-music.apk
          generate_release_notes: true
